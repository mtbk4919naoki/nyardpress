version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions

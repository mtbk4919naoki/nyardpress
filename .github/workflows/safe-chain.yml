name: Safe Chain

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/.npmrc'
      - '.github/workflows/safe-chain.yml'
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/.npmrc'
      - '.github/workflows/safe-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - .
          - www/htdocs/wp-content/themes/nyardpress
          - www/htdocs/wp-content/mu-plugins/site-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project == '.' && 'package-lock.json' || format('{0}/package-lock.json', matrix.project) }}

      - name: Install safe-chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.15/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      - name: Verify dependencies (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: npm ci

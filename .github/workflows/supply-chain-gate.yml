name: Supply chain gate

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.aikido'
      - '.github/workflows/supply-chain-gate.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  SAFE_CHAIN_VERSION: '1.5.15'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install safe-chain
        run: |
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" | sh -s -- --ci
        env:
          SAFE_CHAIN_LOGGING: silent

      - name: npm ci
        run: npm ci
